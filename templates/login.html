<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Коттеджи</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f6ef7">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.10);
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
  }
  .logo { text-align: center; font-size: 2.5rem; margin-bottom: 8px; }
  h1 { text-align: center; font-size: 1.2rem; color: #2c3e50; margin-bottom: 28px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: #7f8c9a; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 0.95rem; color: #2c3e50;
    background: #f4f6f9; margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  input:focus { outline: none; border-color: #4f6ef7; background: #fff; }
  button {
    width: 100%; padding: 11px;
    background: #4f6ef7; color: #fff;
    border: none; border-radius: 8px;
    font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #3a56d4; }
  .error {
    background: #fee2e2; color: #b91c1c;
    border-radius: 8px; padding: 10px 14px;
    font-size: 0.85rem; margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏡</div>
  <h1>Бронирование коттеджей</h1>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>Логин</label>
    <input type="text" name="username" required autofocus placeholder="admin">
    <label>Пароль</label>
    <input type="password" name="password" required placeholder="••••••">
    <button type="submit">Войти</button>
  </form>
</div>
</body>
</html>
