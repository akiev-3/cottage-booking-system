<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта комплекса</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коттеджи">
<meta name="theme-color" content="#4f6ef7">
<style>
  .map-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .map-zoom-btn { width:42px; height:42px; padding:0; font-size:1.3rem; font-weight:700;
                  display:inline-flex; align-items:center; justify-content:center; }
  .map-legend { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:auto; font-size:0.82rem; }
  .map-legend span { display:inline-flex; align-items:center; gap:6px; }
  .lg-dot { width:13px; height:13px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .lg-free { background:#16a34a; } .lg-occ { background:#dc2626; } .lg-none { background:#6b7280; }

  .map-wrap {
    overflow:auto; background:#eef2f7; border-radius:var(--radius); box-shadow:var(--shadow);
    height:calc(100vh - 250px); min-height:340px; -webkit-overflow-scrolling:touch; cursor:grab;
  }
  .map-wrap.grabbing { cursor:grabbing; }
  .map-canvas { position:relative; width:1000px; }
  .map-canvas img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }

  .map-marker {
    position:absolute; transform:translate(-50%,-50%);
    font-size:0.68rem; font-weight:700; line-height:1; color:#fff;
    padding:3px 6px; border-radius:6px; white-space:nowrap; text-decoration:none;
    border:1.5px solid rgba(255,255,255,.9); box-shadow:0 1px 5px rgba(0,0,0,.45);
    cursor:pointer; transition:transform .1s; z-index:2;
  }
  .map-marker:hover { transform:translate(-50%,-50%) scale(1.18); z-index:5; }
  .m-free     { background:#16a34a; }
  .m-occupied { background:#dc2626; }
  .m-none     { background:#6b7280; cursor:default; opacity:.85; }

  @media (max-width:640px){
    .map-wrap { height:calc(100vh - 220px); }
    .map-legend { width:100%; margin-left:0; }
    .map-marker { font-size:0.6rem; padding:2px 5px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="/" class="back-link">← На главную</a>
    <h1>🗺️ Карта комплекса</h1>
  </div>
  <div class="header-right">
    {% if can('services_view') %}<a href="/services" class="btn btn-outline">🛎️ Услуги</a>{% endif %}
    <a href="/logout" class="btn btn-outline">Выйти</a>
  </div>
</header>

<main>
  <div class="map-toolbar">
    <button class="btn btn-outline map-zoom-btn" onclick="mapZoom(1.25)" title="Приблизить">＋</button>
    <button class="btn btn-outline map-zoom-btn" onclick="mapZoom(0.8)"  title="Отдалить">－</button>
    <button class="btn btn-outline" onclick="mapFocus()">🎯 К объектам</button>
    <button class="btn btn-outline" onclick="mapFit()">⛶ Вся карта</button>
    <div class="map-legend">
      <span><i class="lg-dot lg-free"></i> Свободен ({{ free_n }})</span>
      <span><i class="lg-dot lg-occ"></i> Занят ({{ occ_n }})</span>
      <span><i class="lg-dot lg-none"></i> Нет в системе</span>
    </div>
  </div>

  <div class="map-wrap" id="map-wrap">
    <div class="map-canvas" id="map-canvas">
      <img id="map-img" src="{{ url_for('static', filename='img/map.jpg') }}" alt="Опорный план комплекса" draggable="false">
      {% for m in markers %}
        {% if m.id %}
        <a class="map-marker m-{{ m.status }}" style="left:{{ m.x }}%;top:{{ m.y }}%"
           href="/cottages/{{ m.id }}/bookings"
           title="{{ m.label }} — {{ 'занят сегодня' if m.status == 'occupied' else 'свободен' }} · открыть брони">{{ m.label }}</a>
        {% else %}
        <span class="map-marker m-none" style="left:{{ m.x }}%;top:{{ m.y }}%"
              title="{{ m.label }} — нет в системе">{{ m.label }}</span>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</main>

<script>
  const wrap   = document.getElementById('map-wrap');
  const canvas = document.getElementById('map-canvas');
  const img    = document.getElementById('map-img');
  // Зона с метками объектов (% от карты) — чтобы по умолчанию приблизить к ним
  const CLUSTER = { x1: 7, y1: 52, x2: 37, y2: 72 };
  let baseW = 1000, mapScale = 1;

  function applyZoom() { canvas.style.width = Math.round(baseW * mapScale) + 'px'; }

  function mapZoom(f) {
    const prevW = canvas.offsetWidth, prevH = canvas.offsetHeight || 1;
    const cx = (wrap.scrollLeft + wrap.clientWidth  / 2) / prevW;
    const cy = (wrap.scrollTop  + wrap.clientHeight / 2) / prevH;
    mapScale = Math.min(6, Math.max(0.3, mapScale * f));
    applyZoom();
    wrap.scrollLeft = cx * canvas.offsetWidth  - wrap.clientWidth  / 2;
    wrap.scrollTop  = cy * canvas.offsetHeight - wrap.clientHeight / 2;
  }

  function mapFit() {
    baseW = Math.max(320, wrap.clientWidth - 4);
    mapScale = 1; applyZoom();
    wrap.scrollLeft = 0; wrap.scrollTop = 0;
  }

  // Приблизить к зоне объектов и отцентрировать
  function mapFocus() {
    const wPct = (CLUSTER.x2 - CLUSTER.x1) / 100;
    baseW = Math.max(wrap.clientWidth - 4, (wrap.clientWidth - 4) / wPct);
    mapScale = 1; applyZoom();
    const ccx = (CLUSTER.x1 + CLUSTER.x2) / 200;
    const ccy = (CLUSTER.y1 + CLUSTER.y2) / 200;
    wrap.scrollLeft = ccx * canvas.offsetWidth  - wrap.clientWidth  / 2;
    wrap.scrollTop  = ccy * canvas.offsetHeight - wrap.clientHeight / 2;
  }

  // Перетаскивание мышью (на тач работает обычная прокрутка)
  let down = false, sx, sy, sl, st, moved = false;
  wrap.addEventListener('mousedown', e => {
    if (e.target.closest('.map-marker')) return;   // не мешаем клику по метке
    down = true; moved = false; wrap.classList.add('grabbing');
    sx = e.pageX; sy = e.pageY; sl = wrap.scrollLeft; st = wrap.scrollTop; e.preventDefault();
  });
  window.addEventListener('mouseup', () => { down = false; wrap.classList.remove('grabbing'); });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    wrap.scrollLeft = sl - (e.pageX - sx);
    wrap.scrollTop  = st - (e.pageY - sy);
  });

  // Старт: приблизить к объектам
  if (img.complete) mapFocus();
  img.addEventListener('load', mapFocus);
</script>
</body>
</html>
