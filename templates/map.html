<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта комплекса</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коттеджи">
<meta name="theme-color" content="#4f6ef7">
<style>
  .map-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .map-zoom-btn { width:42px; height:42px; padding:0; font-size:1.3rem; font-weight:700;
                  display:inline-flex; align-items:center; justify-content:center; }
  .map-wrap {
    overflow:auto;
    background:#eef2f7;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    height:calc(100vh - 230px);
    min-height:340px;
    -webkit-overflow-scrolling:touch;
    cursor:grab;
  }
  .map-wrap.grabbing { cursor:grabbing; }
  .map-wrap img { display:block; width:1000px; max-width:none; user-select:none; -webkit-user-drag:none; }
  @media (max-width:640px){
    .map-wrap { height:calc(100vh - 200px); }
    .map-toolbar .muted-sm { width:100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="/" class="back-link">← На главную</a>
    <h1>🗺️ Карта комплекса</h1>
  </div>
  <div class="header-right">
    {% if can('services_view') %}<a href="/services" class="btn btn-outline">🛎️ Услуги</a>{% endif %}
    <a href="/logout" class="btn btn-outline">Выйти</a>
  </div>
</header>

<main>
  <div class="map-toolbar">
    <button class="btn btn-outline map-zoom-btn" onclick="mapZoom(1.25)" title="Приблизить">＋</button>
    <button class="btn btn-outline map-zoom-btn" onclick="mapZoom(0.8)"  title="Отдалить">－</button>
    <button class="btn btn-outline" onclick="mapFit()">⛶ По ширине</button>
    <span class="muted-sm">Тяните карту мышью или пальцем, кнопками — масштаб</span>
  </div>
  <div class="map-wrap" id="map-wrap">
    <img id="map-img" src="{{ url_for('static', filename='img/map.jpg') }}" alt="Опорный план комплекса" draggable="false">
  </div>
</main>

<script>
  const wrap = document.getElementById('map-wrap');
  const img  = document.getElementById('map-img');
  let baseW = 1000, mapScale = 1;

  function applyZoom() { img.style.width = Math.round(baseW * mapScale) + 'px'; }

  function mapZoom(f) {
    const prevW = baseW * mapScale, prevH = img.clientHeight || 1;
    const cx = (wrap.scrollLeft + wrap.clientWidth  / 2) / prevW;
    const cy = (wrap.scrollTop  + wrap.clientHeight / 2) / prevH;
    mapScale = Math.min(6, Math.max(0.3, mapScale * f));
    applyZoom();
    // держим центр видимой области на месте
    wrap.scrollLeft = cx * (baseW * mapScale) - wrap.clientWidth  / 2;
    wrap.scrollTop  = cy * img.clientHeight   - wrap.clientHeight / 2;
  }

  function mapFit() {
    baseW = Math.max(320, wrap.clientWidth - 4);
    mapScale = 1;
    applyZoom();
    wrap.scrollLeft = 0; wrap.scrollTop = 0;
  }

  // Перетаскивание мышью (на тач — обычная прокрутка контейнера)
  let down = false, sx, sy, sl, st;
  wrap.addEventListener('mousedown', e => {
    down = true; wrap.classList.add('grabbing');
    sx = e.pageX; sy = e.pageY; sl = wrap.scrollLeft; st = wrap.scrollTop;
    e.preventDefault();
  });
  window.addEventListener('mouseup',   () => { down = false; wrap.classList.remove('grabbing'); });
  window.addEventListener('mousemove', e => {
    if (!down) return;
    wrap.scrollLeft = sl - (e.pageX - sx);
    wrap.scrollTop  = st - (e.pageY - sy);
  });

  // Старт: вписать карту по ширине
  if (img.complete) mapFit();
  img.addEventListener('load', mapFit);
</script>
</body>
</html>
